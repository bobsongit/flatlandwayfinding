<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Route naar Flatland</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #3d3561;
      --mint:   #3dffa0;
      --pink:   #f7a8f2;
      --white:  #ffffff;
      --muted:  rgba(61,53,97,0.45);
      --border: rgba(61,53,97,0.13);
    }

    html, body {
      height: 100%;
      font-family: 'Futura', 'Nunito', 'Century Gothic', Arial, sans-serif;
      background: #f0eef8;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 40px rgba(61,53,97,0.14);
    }

    /* ── HEADER: puur paars + logo PNG ── */
    .card-header {
      background: var(--purple);
      padding: 1.1rem 1.4rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-text .eyebrow {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 3px;
    }
    .header-text h1 {
      font-size: 20px;
      font-weight: 900;
      color: var(--white);
      line-height: 1.15;
    }
    .header-text h1 em {
      font-style: normal;
      color: var(--mint);
    }
    .header-text .subtitle {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,.5);
      margin-top: 3px;
      line-height: 1.4;
    }
    .header-logo {
      height: 52px;
      width: auto;
      flex-shrink: 0;
    }

    /* ── VIDEO + OVERLAY WRAPPER ── */
    .video-section {
      position: relative;
      width: 100%;
      background: var(--purple);
    }
    .video-section video {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
    }

    /* ── STOP DOTS OVERLAY (top) ── */
    .stops-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 10px 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      pointer-events: none;
    }
    .stops-track {
      display: flex;
      align-items: center;
      gap: 0;
      pointer-events: all;
    }
    .stop-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      flex: 1;
      background: none;
      border: none;
      padding: 0;
      position: relative;
    }
    .stop-dot {
      width: 22px; height: 22px;
      border-radius: 6px;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s, transform .1s;
      backdrop-filter: blur(4px);
    }
    .stop-dot i { font-size: 11px; color: var(--white); }
    .stop-btn.active .stop-dot {
      background: var(--mint);
      border-color: var(--mint);
      transform: scale(1.15);
    }
    .stop-btn.active .stop-dot i { color: var(--purple); }
    .stop-btn.passed .stop-dot {
      background: rgba(247,168,242,0.6);
      border-color: var(--pink);
    }
    .stop-label {
      font-size: 8.5px;
      font-weight: 800;
      color: var(--white);
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      text-align: center;
      max-width: 52px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stop-btn.active .stop-label { color: var(--mint); }

    /* connector line between dots */
    .stop-line {
      flex: 1;
      height: 2px;
      background: rgba(255,255,255,0.3);
      margin-bottom: 14px;
      pointer-events: none;
    }
    .stop-line.passed { background: rgba(247,168,242,0.7); }

    /* ── CONTROLS OVERLAY (bottom of video) ── */
    .controls-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(30,25,60,0.92) 0%, rgba(30,25,60,0.0) 100%);
      padding: 32px 14px 14px;
      pointer-events: all;
    }
    .controls-top {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    .play-btn {
      width: 38px; height: 38px;
      border-radius: 9px;
      background: var(--mint);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    .play-btn:hover  { background: #2de88a; }
    .play-btn:active { transform: scale(.95); }
    .play-btn i { font-size: 17px; color: var(--purple); margin-left: 2px; }
    .play-btn.playing i { margin-left: 0; }

    .time-info { flex: 1; min-width: 0; }
    .time-display { font-size: 13px; font-weight: 800; color: var(--white); }
    .time-sub {
      font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,.6);
      margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .time-end { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.4); }

    .scrubber-row { display: flex; align-items: center; gap: 8px; }
    .scrubber-wrap {
      flex: 1; position: relative;
      height: 18px; display: flex; align-items: center;
    }
    .scrubber-track {
      width: 100%; height: 4px;
      background: rgba(255,255,255,.2);
      border-radius: 2px; overflow: hidden;
    }
    .scrubber-fill {
      height: 100%; background: var(--mint);
      border-radius: 2px; width: 0%;
    }
    .scrubber-wrap input[type=range] {
      position: absolute; width: 100%; opacity: 0;
      height: 18px; cursor: pointer; margin: 0;
    }
    .scrubber-thumb {
      position: absolute;
      width: 13px; height: 13px;
      border-radius: 4px;
      background: var(--mint);
      border: 2px solid rgba(30,25,60,.8);
      top: 50%; transform: translateY(-50%) translateX(-6px);
      pointer-events: none;
      left: 0%;
    }

    /* ── FOOTER ── */
    .footer {
      background: var(--purple);
      padding: .75rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .footer-logo { height: 30px; width: auto; }
    .footer-address {
      font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,.45);
      text-align: right; line-height: 1.55;
    }
    .footer-address a { color: rgba(255,255,255,.55); text-decoration: none; }
    .footer-address a:hover { color: var(--mint); }
  </style>
</head>
<body>
<main class="card">

  <!-- HEADER -->
  <div class="card-header">
    <div class="header-text">
      <p class="eyebrow">Bezoekersroute</p>
      <h1>Route naar <em>Flatland</em></h1>
      <p class="subtitle">Rotterdam CS → lift, 12e verdieping</p>
    </div>
    <img src="logo_flatland.png" alt="Flatland" class="header-logo">
  </div>

  <!-- VIDEO + OVERLAYS -->
  <div class="video-section">
    <video id="vid" playsinline preload="metadata">
      <source src="gemini_input.mp4" type="video/mp4">
    </video>

    <!-- Stop dots bovenin video -->
    <div class="stops-overlay">
      <div class="stops-track" id="stopsTrack"></div>
    </div>

    <!-- Controls onderin video -->
    <div class="controls-overlay">
      <div class="controls-top">
        <button class="play-btn" id="playBtn" aria-label="Afspelen">
          <i class="ti ti-player-play" id="playIcon"></i>
        </button>
        <div class="time-info">
          <div class="time-display" id="timeDisplay">0:00</div>
          <div class="time-sub" id="timeSub">Rotterdam Centraal</div>
        </div>
        <span class="time-end" id="timeEnd">0:29</span>
      </div>
      <div class="scrubber-row">
        <div class="scrubber-wrap">
          <div class="scrubber-track"><div class="scrubber-fill" id="scrubFill"></div></div>
          <div class="scrubber-thumb" id="scrubThumb"></div>
          <input type="range" id="scrubber" min="0" max="1000" value="0" step="1" aria-label="Videopositie">
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <img src="logo_flatland.png" alt="Flatland" class="footer-logo">
    <div class="footer-address">
      Weena 70, 12e verdieping · Rotterdam<br>
      <a href="https://flatland.nl" target="_blank" rel="noopener">flatland.nl</a>
      &nbsp;·&nbsp;
      <a href="tel:+31106690079">010 669 0079</a>
    </div>
  </div>

</main>

<script>
  // 5 stops (samengevat uit de 10 waypoints voor compacte weergave)
  const STOPS = [
    { pct:  0,    icon: 'ti-train',       label: 'Rotterdam CS' },
    { pct: 20.7,  icon: 'ti-building',    label: 'Millennium' },
    { pct: 41.4,  icon: 'ti-walk',        label: 'W 200' },
    { pct: 62.1,  icon: 'ti-coffee',      label: 'Seoul Sen.' },
    { pct: 86.2,  icon: 'ti-door-enter',  label: 'Lobby' },
  ];

  // Full 10 waypoints for scrubber label sync
  const WAYPOINTS = [
    { pct:  0,    label: 'Rotterdam Centraal' },
    { pct: 10.3,  label: 'Kruisplein / zebrapad' },
    { pct: 20.7,  label: 'Millennium Tower' },
    { pct: 31.0,  label: 'Ingang Passage' },
    { pct: 41.4,  label: 'Langs W 200' },
    { pct: 51.7,  label: 'Midden Passage' },
    { pct: 62.1,  label: 'Seoul Sensation' },
    { pct: 75.9,  label: 'Weena Central' },
    { pct: 86.2,  label: 'Lobby (draaideur)' },
    { pct: 96.6,  label: 'In de lift' },
  ];

  const TOTAL = 29;
  const vid   = document.getElementById('vid');
  let scrubbing = false;

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s/60) + ':' + (s%60 < 10 ? '0' : '') + (s%60);
  }

  // Build stop buttons
  const track = document.getElementById('stopsTrack');
  STOPS.forEach((s, i) => {
    if (i > 0) {
      const line = document.createElement('div');
      line.className = 'stop-line';
      line.id = 'line-' + i;
      track.appendChild(line);
    }
    const btn = document.createElement('button');
    btn.className = 'stop-btn' + (i === 0 ? ' active' : '');
    btn.id = 'stop-' + i;
    btn.setAttribute('aria-label', s.label);
    btn.innerHTML = `
      <div class="stop-dot"><i class="ti ${s.icon}"></i></div>
      <span class="stop-label">${s.label}</span>
    `;
    btn.addEventListener('click', () => {
      vid.currentTime = (s.pct / 100) * (vid.duration || TOTAL);
      vid.play();
    });
    track.appendChild(btn);
  });

  function updateUI() {
    const dur  = vid.duration || TOTAL;
    const t    = vid.currentTime || 0;
    const frac = t / dur;
    const pct  = frac * 100;

    // scrubber
    document.getElementById('scrubber').value = Math.round(frac * 1000);
    document.getElementById('scrubFill').style.width = pct + '%';
    document.getElementById('scrubThumb').style.left = pct + '%';
    document.getElementById('timeDisplay').textContent = fmt(t);

    // waypoint label
    let activeWP = WAYPOINTS[0];
    WAYPOINTS.forEach(w => { if (pct >= w.pct) activeWP = w; });
    document.getElementById('timeSub').textContent = activeWP.label;

    // stop dots
    let activeStop = STOPS[0];
    STOPS.forEach(s => { if (pct >= s.pct) activeStop = s; });
    STOPS.forEach((s, i) => {
      const btn  = document.getElementById('stop-' + i);
      const passed = pct > s.pct && s !== activeStop;
      btn.classList.toggle('active', s === activeStop);
      btn.classList.toggle('passed', passed);
      if (i > 0) {
        document.getElementById('line-' + i).classList.toggle('passed', pct >= s.pct);
      }
    });
  }

  vid.addEventListener('loadedmetadata', () => {
    document.getElementById('timeEnd').textContent = fmt(vid.duration);
  });
  vid.addEventListener('timeupdate', () => { if (!scrubbing) updateUI(); });

  const playBtn  = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  function syncBtn() {
    const p = !vid.paused;
    playIcon.className = p ? 'ti ti-player-pause' : 'ti ti-player-play';
    playBtn.classList.toggle('playing', p);
    playBtn.setAttribute('aria-label', p ? 'Pauzeren' : 'Afspelen');
    playIcon.style.marginLeft = p ? '0' : '2px';
  }
  playBtn.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
  vid.addEventListener('play',  syncBtn);
  vid.addEventListener('pause', syncBtn);
  vid.addEventListener('ended', () => { syncBtn(); updateUI(); });

  const scrubEl = document.getElementById('scrubber');
  scrubEl.addEventListener('mousedown',  () => { scrubbing = true; });
  scrubEl.addEventListener('touchstart', () => { scrubbing = true; }, { passive: true });
  scrubEl.addEventListener('input', e => {
    const frac = e.target.value / 1000;
    const pct  = frac * 100;
    document.getElementById('scrubFill').style.width  = pct + '%';
    document.getElementById('scrubThumb').style.left  = pct + '%';
    document.getElementById('timeDisplay').textContent = fmt(frac * (vid.duration || TOTAL));
  });
  scrubEl.addEventListener('change', e => {
    vid.currentTime = (e.target.value / 1000) * (vid.duration || TOTAL);
    scrubbing = false;
    updateUI();
  });
  scrubEl.addEventListener('mouseup',  () => { scrubbing = false; });
  scrubEl.addEventListener('touchend', () => { scrubbing = false; });
</script>
</body>
</html>
