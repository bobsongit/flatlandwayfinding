<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Route naar Flatland</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #3d3561;
      --mint:   #3dffa0;
      --pink:   #f7a8f2;
      --white:  #ffffff;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Futura', 'Nunito', 'Century Gothic', Arial, sans-serif;
      background: var(--purple);
    }

    /* Full-screen flex column */
    .shell {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      background: var(--purple);
      padding: clamp(.6rem, 2vw, 1rem) clamp(.9rem, 3vw, 1.5rem);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .header-text .eyebrow {
      font-size: clamp(8px, 1.8vw, 10px);
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 2px;
    }
    .header-text h1 {
      font-size: clamp(15px, 4vw, 22px);
      font-weight: 900;
      color: var(--white);
      line-height: 1.15;
    }
    .header-text h1 em {
      font-style: normal;
      color: var(--mint);
    }
    .header-text .subtitle {
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 600;
      color: rgba(255,255,255,.45);
      margin-top: 2px;
    }

    /* Maps CTA button */
    .maps-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--mint);
      color: var(--purple);
      font-family: inherit;
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 800;
      text-decoration: none;
      border-radius: 8px;
      padding: .45rem .75rem;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
      white-space: nowrap;
    }
    .maps-btn:hover  { background: #2de88a; }
    .maps-btn:active { transform: scale(.96); }
    /* Google Maps pin icon in brand colors — inline SVG */
    .maps-btn svg {
      width: 14px; height: 14px;
      flex-shrink: 0;
    }

    /* ── VIDEO — fills remaining space ── */
    .video-section {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
      overflow: hidden;
    }
    .video-section video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── STOPS OVERLAY (top of video) ── */
    .stops-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: clamp(8px,2vw,14px) clamp(10px,3vw,18px) 0;
      pointer-events: none;
    }
    .stops-track {
      display: flex;
      align-items: flex-start;
      pointer-events: all;
    }
    .stop-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .stop-dot {
      width: clamp(22px,5.5vw,30px);
      height: clamp(22px,5.5vw,30px);
      border-radius: 7px;
      background: rgba(255,255,255,.2);
      border: 2px solid rgba(255,255,255,.45);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s, transform .12s;
      backdrop-filter: blur(6px);
    }
    .stop-dot i {
      font-size: clamp(11px,2.8vw,15px);
      color: var(--white);
    }
    .stop-btn.active .stop-dot {
      background: var(--mint);
      border-color: var(--mint);
      transform: scale(1.15);
      box-shadow: 0 0 0 3px rgba(61,255,160,.3);
    }
    .stop-btn.active .stop-dot i { color: var(--purple); }
    .stop-btn.passed .stop-dot {
      background: rgba(247,168,242,.55);
      border-color: var(--pink);
    }
    .stop-label {
      font-size: clamp(8px,2vw,10px);
      font-weight: 800;
      color: var(--white);
      text-shadow: 0 1px 4px rgba(0,0,0,.7);
      text-align: center;
      line-height: 1.2;
      max-width: 58px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stop-btn.active .stop-label { color: var(--mint); text-shadow: none; }
    .stop-btn.passed .stop-label { color: var(--pink); }

    .stop-line {
      flex: 1;
      height: 2px;
      background: rgba(255,255,255,.3);
      margin-top: clamp(10px,2.7vw,14px);
      pointer-events: none;
      transition: background .2s;
    }
    .stop-line.passed { background: rgba(247,168,242,.7); }

    /* ── CONTROLS OVERLAY (bottom of video) ── */
    .controls-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(20,16,48,.93) 0%, rgba(20,16,48,.0) 100%);
      padding: clamp(36px,9vw,60px) clamp(12px,3vw,18px) clamp(12px,3vw,18px);
    }
    .scrubber-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: clamp(10px,2.5vw,16px);
    }
    .time-display {
      font-size: clamp(11px,2.8vw,14px);
      font-weight: 800;
      color: var(--white);
      flex-shrink: 0;
    }
    .time-end {
      font-size: clamp(11px,2.8vw,14px);
      font-weight: 700;
      color: rgba(255,255,255,.38);
      flex-shrink: 0;
    }
    .scrubber-wrap {
      flex: 1;
      position: relative;
      height: 18px;
      display: flex;
      align-items: center;
    }
    .scrubber-track {
      width: 100%; height: 4px;
      background: rgba(255,255,255,.2);
      border-radius: 2px; overflow: hidden;
    }
    .scrubber-fill {
      height: 100%; background: var(--mint);
      border-radius: 2px; width: 0%;
    }
    .scrubber-wrap input[type=range] {
      position: absolute; width: 100%; opacity: 0;
      height: 18px; cursor: pointer; margin: 0;
    }
    .scrubber-thumb {
      position: absolute;
      width: 13px; height: 13px;
      border-radius: 4px;
      background: var(--mint);
      border: 2px solid rgba(20,16,48,.8);
      top: 50%; transform: translateY(-50%) translateX(-6px);
      pointer-events: none;
      left: 0%;
    }
    .transport {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px,4vw,24px);
      margin-bottom: clamp(6px,1.5vw,10px);
    }
    .skip-btn {
      width: clamp(38px,9vw,50px);
      height: clamp(38px,9vw,50px);
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      border: 2px solid rgba(255,255,255,.35);
      backdrop-filter: blur(4px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }
    .skip-btn:hover  { background: rgba(255,255,255,.28); }
    .skip-btn:active { transform: scale(.92); }
    .skip-btn i { font-size: clamp(16px,4vw,20px); color: var(--white); }
    .play-btn {
      width: clamp(56px,13vw,72px);
      height: clamp(56px,13vw,72px);
      border-radius: 50%;
      background: var(--mint);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 0 6px rgba(61,255,160,.18);
      transition: background .15s, transform .1s, box-shadow .15s;
    }
    .play-btn:hover  { background: #2de88a; box-shadow: 0 0 0 9px rgba(61,255,160,.22); }
    .play-btn:active { transform: scale(.94); }
    .play-btn i { font-size: clamp(24px,6vw,32px); color: var(--purple); margin-left: 3px; }
    .play-btn.playing i { margin-left: 0; }
    .time-sub {
      font-size: clamp(9px,2.2vw,11px);
      font-weight: 700;
      color: rgba(255,255,255,.6);
      text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* ── FOOTER ── */
    .footer {
      background: var(--purple);
      padding: clamp(.5rem,1.5vw,.75rem) clamp(.9rem,3vw,1.5rem);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .footer-logo { height: clamp(22px,5vw,30px); width: auto; }
    .footer-address {
      font-size: clamp(9px,1.9vw,11px);
      font-weight: 600;
      color: rgba(255,255,255,.4);
      text-align: right;
      line-height: 1.5;
    }
    .footer-address a { color: rgba(255,255,255,.55); text-decoration: none; }
    .footer-address a:hover { color: var(--mint); }
  </style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <div class="header">
    <div class="header-text">
      <p class="eyebrow">Bezoekersroute</p>
      <h1>Van Rotterdam CS naar <em>Flatland</em></h1>
      <p class="subtitle">12e verdieping · ~5 min lopen</p>
    </div>
    <a class="maps-btn"
       href="https://www.google.com/maps/dir/?api=1&destination=Weena+70,+Rotterdam"
       target="_blank" rel="noopener"
       aria-label="Open route in Google Maps">
      <!-- Google Maps pin SVG in brand kleuren -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="var(--purple)"/>
        <circle cx="12" cy="9" r="2.5" fill="var(--mint)"/>
      </svg>
      Open in Maps
    </a>
  </div>

  <!-- VIDEO + OVERLAYS -->
  <div class="video-section">
    <video id="vid" playsinline preload="metadata">
      <source src="gemini_input.mp4" type="video/mp4">
    </video>

    <!-- Stops bovenin -->
    <div class="stops-overlay">
      <div class="stops-track" id="stopsTrack"></div>
    </div>

    <!-- Controls onderin -->
    <div class="controls-overlay">
      <!-- scrubber -->
      <div class="scrubber-row">
        <span class="time-display" id="timeDisplay">0:00</span>
        <div class="scrubber-wrap">
          <div class="scrubber-track"><div class="scrubber-fill" id="scrubFill"></div></div>
          <div class="scrubber-thumb" id="scrubThumb"></div>
          <input type="range" id="scrubber" min="0" max="1000" value="0" step="1" aria-label="Videopositie">
        </div>
        <span class="time-end" id="timeEnd">0:29</span>
      </div>
      <!-- transport: prev | play | next -->
      <div class="transport">
        <button class="skip-btn" id="prevBtn" aria-label="Vorige waypoint">
          <i class="ti ti-player-skip-back"></i>
        </button>
        <button class="play-btn" id="playBtn" aria-label="Afspelen">
          <i class="ti ti-player-play" id="playIcon"></i>
        </button>
        <button class="skip-btn" id="nextBtn" aria-label="Volgende waypoint">
          <i class="ti ti-player-skip-forward"></i>
        </button>
      </div>
      <!-- current location label -->
      <div class="time-sub" id="timeSub">Rotterdam Centraal</div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <img src="logo_flatland.png" alt="Flatland" class="footer-logo">
    <div class="footer-address">
      Weena 70, 12e verdieping · Rotterdam<br>
      <a href="https://flatland.nl" target="_blank" rel="noopener">flatland.nl</a>
      &nbsp;·&nbsp;
      <a href="tel:+31106690079">010 669 0079</a>
    </div>
  </div>

</div>
<script>
  const STOPS = [
    { pct:  0,    icon: 'ti-train',      label: 'Rotterdam CS' },
    { pct: 20.7,  icon: 'ti-building',   label: 'Millennium'   },
    { pct: 41.4,  icon: 'ti-walk',       label: 'W 200'        },
    { pct: 62.1,  icon: 'ti-coffee',     label: 'Seoul Sen.'   },
    { pct: 86.2,  icon: 'ti-door-enter', label: 'Ingang'       },
  ];

  const WAYPOINTS = [
    { pct:  0,    label: 'Rotterdam Centraal'   },
    { pct: 10.3,  label: 'Kruisplein / zebrapad'},
    { pct: 20.7,  label: 'Millennium Tower'     },
    { pct: 31.0,  label: 'Ingang Passage'       },
    { pct: 41.4,  label: 'Langs W 200'          },
    { pct: 51.7,  label: 'Midden Passage'       },
    { pct: 62.1,  label: 'Seoul Sensation'      },
    { pct: 75.9,  label: 'Weena Central'        },
    { pct: 86.2,  label: 'Ingang Weena Central' },
    { pct: 96.6,  label: 'In de lift'           },
  ];

  const TOTAL = 29;
  const vid   = document.getElementById('vid');
  let scrubbing = false;

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s/60) + ':' + (s%60 < 10 ? '0' : '') + (s%60);
  }

  // Build stop buttons
  const track = document.getElementById('stopsTrack');
  STOPS.forEach((s, i) => {
    if (i > 0) {
      const line = document.createElement('div');
      line.className = 'stop-line';
      line.id = 'line-' + i;
      track.appendChild(line);
    }
    const btn = document.createElement('button');
    btn.className = 'stop-btn' + (i === 0 ? ' active' : '');
    btn.id = 'stop-' + i;
    btn.setAttribute('aria-label', 'Spring naar: ' + s.label);
    btn.innerHTML = `<div class="stop-dot"><i class="ti ${s.icon}"></i></div><span class="stop-label">${s.label}</span>`;
    btn.addEventListener('click', () => {
      vid.currentTime = (s.pct / 100) * (vid.duration || TOTAL);
      vid.play();
    });
    track.appendChild(btn);
  });

  function updateUI() {
    const dur  = vid.duration || TOTAL;
    const t    = vid.currentTime || 0;
    const frac = t / dur;
    const pct  = frac * 100;

    document.getElementById('scrubber').value = Math.round(frac * 1000);
    document.getElementById('scrubFill').style.width = pct + '%';
    document.getElementById('scrubThumb').style.left = pct + '%';
    document.getElementById('timeDisplay').textContent = fmt(t);

    let activeWP = WAYPOINTS[0];
    WAYPOINTS.forEach(w => { if (pct >= w.pct) activeWP = w; });
    document.getElementById('timeSub').textContent = activeWP.label;

    let activeStop = STOPS[0];
    STOPS.forEach(s => { if (pct >= s.pct) activeStop = s; });
    STOPS.forEach((s, i) => {
      document.getElementById('stop-' + i).classList.toggle('active', s === activeStop);
      document.getElementById('stop-' + i).classList.toggle('passed', pct > s.pct && s !== activeStop);
      if (i > 0) document.getElementById('line-' + i).classList.toggle('passed', pct >= s.pct);
    });
  }

  vid.addEventListener('loadedmetadata', () => {
    document.getElementById('timeEnd').textContent = fmt(vid.duration);
  });
  vid.addEventListener('timeupdate', () => { if (!scrubbing) updateUI(); });

  const playBtn  = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  function syncBtn() {
    const p = !vid.paused;
    playIcon.className = p ? 'ti ti-player-pause' : 'ti ti-player-play';
    playBtn.classList.toggle('playing', p);
    playBtn.setAttribute('aria-label', p ? 'Pauzeren' : 'Afspelen');
    playIcon.style.marginLeft = p ? '0' : '2px';
  }
  playBtn.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
  vid.addEventListener('play',  syncBtn);
  vid.addEventListener('pause', syncBtn);
  vid.addEventListener('ended', () => { syncBtn(); updateUI(); });

  // prev / next — navigate between the 10 full waypoints
  function currentWPIndex() {
    const pct = ((vid.currentTime || 0) / (vid.duration || TOTAL)) * 100;
    let idx = 0;
    WAYPOINTS.forEach((w, i) => { if (pct >= w.pct) idx = i; });
    return idx;
  }
  document.getElementById('prevBtn').addEventListener('click', () => {
    const i = currentWPIndex();
    const target = WAYPOINTS[Math.max(0, i - 1)];
    vid.currentTime = (target.pct / 100) * (vid.duration || TOTAL);
    vid.play();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    const i = currentWPIndex();
    const target = WAYPOINTS[Math.min(WAYPOINTS.length - 1, i + 1)];
    vid.currentTime = (target.pct / 100) * (vid.duration || TOTAL);
    vid.play();
  });

  const scrubEl = document.getElementById('scrubber');
  scrubEl.addEventListener('mousedown',  () => { scrubbing = true; });
  scrubEl.addEventListener('touchstart', () => { scrubbing = true; }, { passive: true });
  scrubEl.addEventListener('input', e => {
    const frac = e.target.value / 1000;
    const pct  = frac * 100;
    document.getElementById('scrubFill').style.width  = pct + '%';
    document.getElementById('scrubThumb').style.left  = pct + '%';
    document.getElementById('timeDisplay').textContent = fmt(frac * (vid.duration || TOTAL));
  });
  scrubEl.addEventListener('change', e => {
    vid.currentTime = (e.target.value / 1000) * (vid.duration || TOTAL);
    scrubbing = false;
    updateUI();
  });
  scrubEl.addEventListener('mouseup',  () => { scrubbing = false; });
  scrubEl.addEventListener('touchend', () => { scrubbing = false; });
</script>
</body>
</html>
